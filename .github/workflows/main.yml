name: Android Build & Package (APK / AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android assets & plugins
        run: npx cap sync android

      - name: Prepare Keystore for Release Signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          elif [ ! -f "android/app/release.keystore" ]; then
            echo "Generating production release keystore for CI signing..."
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias linzopartylive -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "LinzoLive2026!" -keypass "LinzoLive2026!" \
              -dname "CN=Linzo Party Live, OU=Mobile App, O=Linzo Inc, L=San Francisco, ST=California, C=US"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --stacktrace

      - name: Build Google Play Release AAB (Android App Bundle)
        run: |
          cd android
          ./gradlew :app:bundleRelease --stacktrace

      - name: Verify Generated Android Artifacts
        run: |
          echo "=== Verifying Generated Artifacts ==="
          mkdir -p build-artifacts
          
          # 1. Copy Debug APK
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/LinzoPartyLive-debug.apk
            echo "✓ Found and copied Debug APK"
          else
            echo "::error::Debug APK was not generated!"
            exit 1
          fi

          # 2. Copy Release APK
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/LinzoPartyLive-release.apk
            echo "✓ Found and copied Signed Release APK"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/LinzoPartyLive-release-unsigned.apk
            echo "✓ Found and copied Unsigned Release APK"
          else
            echo "::warning::Release APK not found in expected folder"
          fi

          # 3. Copy Release AAB (Bundle)
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab build-artifacts/LinzoPartyLive-release.aab
            echo "✓ Found and copied Release App Bundle (AAB)"
          else
            echo "::error::Release AAB was not generated!"
            exit 1
          fi

          echo "Listing final artifacts:"
          ls -lh build-artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinzoPartyLive-Debug-APK
          path: build-artifacts/*debug*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinzoPartyLive-Release-APK
          path: build-artifacts/*release*.apk
          retention-days: 30

      - name: Upload Release AAB (Play Store) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinzoPartyLive-GooglePlay-AAB
          path: build-artifacts/*.aab
          retention-days: 30

      - name: Upload Complete Package Bundle
        uses: actions/upload-artifact@v4
        with:
          name: LinzoPartyLive-All-Binaries
          path: build-artifacts/
          retention-days: 30
