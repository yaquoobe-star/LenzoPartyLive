name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & Install SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          mkdir -p "$SDK_ROOT/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e442d45c825e623e11401a5\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a578e442d45c825e623e11401a5\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "Found sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Configure Android SDK & Gradle for CI
        run: |
          rm -f android/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/variables.gradle || true
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug -x lint -x test --no-daemon --stacktrace

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease -x lint -x test --no-daemon --stacktrace || true

      - name: Build Play Store AAB Bundle
        run: |
          cd android
          ./gradlew :app:bundleRelease -x lint -x test --no-daemon --stacktrace || true

      - name: Verify Generated Android Artifacts
        run: |
          echo "=== Generated APKs ==="
          find android/app/build/outputs/apk -type f -name "*.apk" -ls || true
          echo "=== Generated Bundles ==="
          find android/app/build/outputs/bundle -type f -name "*.aab" -ls || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LinzoPartyLive-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LinzoPartyLive-PlayStore-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
