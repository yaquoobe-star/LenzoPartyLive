name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Copy Assets to Android
        run: npx cap copy android

      - name: Sync Plugins to Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Build Play Store AAB Bundle
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LinzoPartyLive-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: LinzoPartyLive-PlayStore-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
