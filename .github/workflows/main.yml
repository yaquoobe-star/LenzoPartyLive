name: Build Production Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  release:
    types: [ created, published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Signed Production Release
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & Install SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e442d45c825e623e11401a5\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a578e442d45c825e623e11401a5\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/tools/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Decode Keystore & Extract SHA-1 / SHA-256 Fingerprints via keytool
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One or more required GitHub signing secrets (KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD) are missing."
            exit 1
          fi
          KEYSTORE_FILE="${{ runner.temp }}/lenzo-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi
          KEYTOOL_OUT="${{ runner.temp }}/keytool_info.txt"
          if ! keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$KEYTOOL_OUT" 2>/dev/null; then
            rm -f "$KEYTOOL_OUT" "$KEYSTORE_FILE"
            echo "::error::Failed to verify existing release keystore or alias with keytool."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const out = fs.readFileSync(process.argv[1], "utf8");
            const sha1Match = out.match(/SHA1:\s*([0-9A-Fa-f:]+)/i);
            const sha256Match = out.match(/SHA256:\s*([0-9A-Fa-f:]+)/i);
            if (!sha1Match || !sha256Match) {
              console.error("Could not extract SHA-1 / SHA-256 fingerprints from keytool output.");
              process.exit(1);
            }
            const sha1 = sha1Match[1].toUpperCase();
            const sha256 = sha256Match[1].toUpperCase();
            fs.appendFileSync(process.env.GITHUB_ENV,
              "KEYSTORE_SHA1=" + sha1 + "\n" +
              "KEYSTORE_SHA256=" + sha256 + "\n" +
              "KEYSTORE_SHA1_HEX=" + sha1.replace(/:/g, "").toLowerCase() + "\n" +
              "KEYSTORE_SHA256_HEX=" + sha256.replace(/:/g, "").toLowerCase() + "\n"
            );
            console.log("Verified existing release keystore certificate via keytool.");
            console.log("Keystore SHA-1: " + sha1);
            console.log("Keystore SHA-256: " + sha256);
          ' "$KEYTOOL_OUT"
          rm -f "$KEYTOOL_OUT"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          # Enforce release metadata after Capacitor sync (Python avoids shell/JS quote parsing issues).
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, c1 = re.subn(r'^\s*versionCode\s+\d+\s*$', '        versionCode 6', s, count=1, flags=re.M)
          s, c2 = re.subn(r'^\s*versionName\s+"[^"]+"\s*$', '        versionName "1.0.5"', s, count=1, flags=re.M)
          if c1 != 1 or c2 != 1 or not re.search(r'^\s*versionCode\s+6\s*$', s, re.M) or not re.search(r'^\s*versionName\s+"1\.0\.5"\s*$', s, re.M):
              print("::error::Could not enforce Android versionCode 6 / versionName 1.0.4")
              sys.exit(1)
          p.write_text(s)
          print("Enforced Android versionName 1.0.5 and versionCode 6.")
          PY

      - name: Configure Android SDK & Gradle for CI
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          rm -rf android/.gradle android/app/build
          rm -f android/local.properties android/app/release.keystore
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/variables.gradle || true
          if [ ! -f android/app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Restored android/app/google-services.json from GOOGLE_SERVICES_JSON secret."
          fi
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::Missing android/app/google-services.json. Do not generate a partial Firebase config from firebase-applet-config.json because it omits Android OAuth certificate clients."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("android/app/google-services.json", "utf8"));
            const pkg = "com.lenzoparty.app";
            const expected = [
              "68b8c557bf1cf2dcf1da692bf6d3ee6a1fc9c70b",
              "4f75d184db6f6637368f1a4173ae4bddb8cf093d"
            ];
            const clients = (cfg.client || []).filter(c =>
              c.client_info?.android_client_info?.package_name === pkg
            );
            const androidHashes = clients.flatMap(c => (c.oauth_client || [])
              .filter(o => o.client_type === 1 && o.android_info?.package_name === pkg)
              .map(o => String(o.android_info.certificate_hash || "").replace(/:/g, "").toLowerCase()));
            const hasWeb = clients.some(c => (c.oauth_client || []).some(o => o.client_type === 3 && o.client_id));
            const missing = expected.filter(h => !androidHashes.includes(h));
            if (cfg.project_info?.project_id !== "confident-drake-3bcxw" || clients.length === 0 || missing.length || !hasWeb) {
              console.error("Firebase OAuth configuration is incomplete for " + pkg);
              console.error("Missing Android SHA-1 entries: " + (missing.join(", ") || "none"));
              console.error("Web OAuth client present: " + hasWeb);
              process.exit(1);
            }
            console.log("Firebase config verified: package, Play App Signing SHA-1, upload SHA-1, and Web OAuth client are present.");
          '
          chmod +x android/gradlew

      - name: Build Signed Production APK & AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:clean :app:assembleRelease :app:bundleRelease -x lint -x test --no-daemon --stacktrace --console=plain

      - name: Stage Production Binaries
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/app-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist-android/app-release.aab
          ls -lh dist-android/app-release.apk dist-android/app-release.aab

      - name: Verify APK & AAB Signatures, Metadata, and Certificate Match
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          echo "=== 0. Verify Firebase google-services.json ==="
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing!"
            exit 1
          fi

          echo "=== 1. Verify APK Signature (apksigner) ==="
          "$APKSIGNER" verify --verbose --print-certs dist-android/app-release.apk > apk_verify.txt
          cat apk_verify.txt

          if grep -qi "CN=Android Debug" apk_verify.txt; then
            echo "::error::APK is signed with a debug certificate! Production release aborted."
            exit 1
          fi

          APK_SHA1=$(grep -i "Signer #1 certificate SHA-1 digest:" apk_verify.txt | awk '{print tolower($NF)}' | head -n 1)
          APK_SHA256=$(grep -i "Signer #1 certificate SHA-256 digest:" apk_verify.txt | awk '{print tolower($NF)}' | head -n 1)
          if [ -z "$APK_SHA1" ] || [ -z "$APK_SHA256" ]; then
            echo "::error::Failed to extract APK SHA-1 / SHA-256 signing certificate digests."
            exit 1
          fi
          echo "APK Signer SHA-1: $APK_SHA1"
          echo "APK Signer SHA-256: $APK_SHA256"

          echo "=== 2. Check APK Package ID & Version ==="
          "$AAPT2" dump badging dist-android/app-release.apk > apk_badging.txt
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:" apk_badging.txt
          eval "$(node -e '
            const fs = require("fs");
            const line = fs.readFileSync("apk_badging.txt", "utf8").split("\n").find(l => l.startsWith("package:")) || "";
            const pkg = (line.match(/(?:^|\s)name='\''([^'\'']+)'\''/) || [])[1] || "";
            const vc = (line.match(/(?:^|\s)versionCode='\''([^'\'']+)'\''/) || [])[1] || "1";
            const vn = (line.match(/(?:^|\s)versionName='\''([^'\'']+)'\''/) || [])[1] || "1.0";
            console.log(`PKG_NAME="${pkg}"`);
            console.log(`VER_CODE="${vc}"`);
            console.log(`VER_NAME="${vn}"`);
          ')"
          if [ "$PKG_NAME" != "com.lenzoparty.app" ]; then
            echo "::error::Unexpected package name '$PKG_NAME' (expected com.lenzoparty.app)."
            exit 1
          fi
          if [ "$VER_CODE" != "6" ] || [ "$VER_NAME" != "1.0.5" ]; then
            echo "::error::APK version mismatch: expected versionName 1.0.5 and versionCode 6; got $VER_NAME / $VER_CODE."
            exit 1
          fi

          echo "=== 3. Verify AAB Signature (jarsigner + keytool) ==="
          jarsigner -verify -verbose -certs dist-android/app-release.aab > aab_verify.txt
          tail -n 15 aab_verify.txt

          keytool -printcert -jarfile dist-android/app-release.aab > aab_cert.txt
          eval "$(node -e '
            const fs = require("fs");
            const cert = fs.readFileSync("aab_cert.txt", "utf8");
            const s1 = (cert.match(/SHA-?1:\s*([0-9A-Fa-f:]+)/i) || [])[1] || "";
            const s256 = (cert.match(/SHA-?256:\s*([0-9A-Fa-f:]+)/i) || [])[1] || "";
            console.log(`AAB_SHA1="${s1.replace(/:/g, "").toLowerCase()}"`);
            console.log(`AAB_SHA256="${s256.replace(/:/g, "").toLowerCase()}"`);
          ')"
          if [ -z "$AAB_SHA1" ] || [ -z "$AAB_SHA256" ]; then
            echo "::error::Failed to extract AAB SHA-1 / SHA-256 signing certificate digests."
            exit 1
          fi
          echo "AAB Signer SHA-1: $AAB_SHA1"
          echo "AAB Signer SHA-256: $AAB_SHA256"

          if [ "$APK_SHA1" != "$KEYSTORE_SHA1_HEX" ] || [ "$APK_SHA256" != "$KEYSTORE_SHA256_HEX" ]; then
            echo "::error::Certificate mismatch between existing keystore and app-release.apk!"
            exit 1
          fi
          if [ "$AAB_SHA1" != "$KEYSTORE_SHA1_HEX" ] || [ "$AAB_SHA256" != "$KEYSTORE_SHA256_HEX" ]; then
            echo "::error::Certificate mismatch between existing keystore and app-release.aab!"
            exit 1
          fi
          echo "Confirmed: Keystore, app-release.apk, and app-release.aab share the exact same release certificate."

          echo "=== 4. Validate AAB via bundletool ==="
          curl -sSL -o "${{ runner.temp }}/bundletool.jar" "https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar"
          java -jar "${{ runner.temp }}/bundletool.jar" validate --bundle=dist-android/app-release.aab
          java -jar "${{ runner.temp }}/bundletool.jar" dump manifest --bundle=dist-android/app-release.aab > aab_manifest.txt
          grep -E "package=|versionCode=|versionName=" aab_manifest.txt
          if ! grep -Eq 'versionCode="6"' aab_manifest.txt || ! grep -Eq 'versionName="1.0.5"' aab_manifest.txt; then
            echo "::error::AAB manifest version mismatch: expected versionName 1.0.5 and versionCode 6."
            exit 1
          fi

          echo "VER_CODE=${VER_CODE:-1}" >> $GITHUB_ENV
          echo "VER_NAME=${VER_NAME:-1.0}" >> $GITHUB_ENV

      - name: Generate signing-fingerprints.txt & GitHub Actions Build Summary
        run: |
          BUILD_DATE_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_VER="${VER_NAME:-1.0} (versionCode ${VER_CODE:-1})"

          cat > dist-android/signing-fingerprints.txt <<EOF
          ================================================================
          LENZO PARTY LIVE – ANDROID SIGNING CERTIFICATE
          ================================================================
          Application Name : Lenzo Party Live
          Package Name     : com.lenzoparty.app
          Firebase Project : confident-drake-3bcxw
          Certificate Type : Existing Release / Upload Signing Keystore
          Build Version    : $BUILD_VER
          Build Date (UTC) : $BUILD_DATE_UTC

          ----------------------------------------------------------------
          A. UPLOAD / RELEASE CERTIFICATE FINGERPRINTS (Existing Keystore)
          ----------------------------------------------------------------
          SHA-1 Fingerprint:
          $KEYSTORE_SHA1

          SHA-256 Fingerprint:
          $KEYSTORE_SHA256

          ----------------------------------------------------------------
          B. GOOGLE PLAY APP SIGNING CERTIFICATE (If Play Signing Enabled)
          ----------------------------------------------------------------
          Note: If Google Play App Signing is enabled for com.lenzoparty.app,
          Google re-signs end-user APKs delivered from Play Store with a separate
          App Signing Key Certificate. Never confuse these two certificates:
            - Upload Certificate (above): Signs your CI APK and Play Upload AAB.
            - Play App Signing Certificate: Managed by Google Play. Obtain its
              SHA-1 and SHA-256 separately from:
              Google Play Console -> Test and release -> Setup -> App integrity.
          Register BOTH certificates in Firebase Console when Play App Signing is enabled.

          ----------------------------------------------------------------
          FIREBASE CONSOLE REGISTRATION INSTRUCTIONS
          ----------------------------------------------------------------
          1. Open Firebase Console -> Project Settings -> General -> Your Apps -> Lenzo Party Live (com.lenzoparty.app) -> SHA Certificate Fingerprints.
          2. Click "Add fingerprint" and add the SHA-1 value separately:
             $KEYSTORE_SHA1
          3. Click "Add fingerprint" and add the SHA-256 value separately:
             $KEYSTORE_SHA256
          4. If Play App Signing is enabled, repeat for Google Play App Signing SHA-1 and SHA-256 from Google Play Console -> App Integrity.
          5. Download the updated google-services.json and store its JSON in GitHub Repository Secret GOOGLE_SERVICES_JSON.
          ================================================================
          EOF

          cat > "${{ runner.temp }}/release-notes-fingerprints.md" <<EOF
          ## LENZO PARTY LIVE – ANDROID SIGNING CERTIFICATE

          - **Application Name:** Lenzo Party Live
          - **Package Name:** \`com.lenzoparty.app\`
          - **Signing Key:** Existing Release Keystore
          - **Build Version:** \`$BUILD_VER\`
          - **Build Date (UTC):** \`$BUILD_DATE_UTC\`

          ### SHA-1 Fingerprint
          \`\`\`text
          $KEYSTORE_SHA1
          \`\`\`

          ### SHA-256 Fingerprint
          \`\`\`text
          $KEYSTORE_SHA256
          \`\`\`

          ### Firebase Configuration Instructions
          1. Open **Firebase Console → Project Settings → General → Your Apps → Lenzo Party Live → SHA Certificate Fingerprints**.
          2. Add **SHA-1** and **SHA-256** separately.
          3. Download updated \`google-services.json\` if needed and update GitHub Secret \`GOOGLE_SERVICES_JSON\`.

          ### Google Play App Signing vs Upload Certificate
          - **A. Upload Certificate SHA-1 & SHA-256:** Shown above (generated from your existing release keystore used to sign \`app-release.apk\` and \`app-release.aab\`).
          - **B. Google Play App Signing Certificate SHA-1 & SHA-256:** If Google Play App Signing is enabled, obtain the Play App Signing certificate fingerprints from **Google Play Console → App Integrity** and add them separately to Firebase Console. Never confuse these two certificates.
          EOF

          cat "${{ runner.temp }}/release-notes-fingerprints.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean Up Temporary Keystore & Temp Files
        if: always()
        run: |
          rm -f "${{ runner.temp }}/lenzo-release.keystore" "${{ runner.temp }}/keytool_info.txt" "${{ runner.temp }}/bundletool.jar" apk_verify.txt apk_badging.txt aab_verify.txt aab_cert.txt aab_manifest.txt

      - name: Upload Signed Production APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: dist-android/app-release.apk
          retention-days: 30

      - name: Upload Signed Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: dist-android/app-release.aab
          retention-days: 30

      - name: Upload Signing Fingerprints Report
        uses: actions/upload-artifact@v4
        with:
          name: signing-fingerprints.txt
          path: dist-android/signing-fingerprints.txt
          retention-days: 30

      - name: Upload Combined Production Package
        uses: actions/upload-artifact@v4
        with:
          name: LenzoPartyLive-Production-Release
          path: |
            dist-android/app-release.apk
            dist-android/app-release.aab
            dist-android/signing-fingerprints.txt
          retention-days: 30

      - name: Update GitHub Release Notes & Assets with Fingerprints
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ -n "$TAG_NAME" ]; then
            BODY_FILE="${{ runner.temp }}/combined-release-body.md"
            gh release view "$TAG_NAME" --json body --jq '.body // ""' > "$BODY_FILE" || true
            if ! grep -q "LENZO PARTY LIVE – ANDROID SIGNING CERTIFICATE" "$BODY_FILE" 2>/dev/null; then
              printf "\n\n" >> "$BODY_FILE"
              cat "${{ runner.temp }}/release-notes-fingerprints.md" >> "$BODY_FILE"
              gh release edit "$TAG_NAME" --notes-file "$BODY_FILE"
            fi
            gh release upload "$TAG_NAME" \
              dist-android/app-release.apk \
              dist-android/app-release.aab \
              dist-android/signing-fingerprints.txt \
              --clobber
            rm -f "$BODY_FILE" "${{ runner.temp }}/release-notes-fingerprints.md"
          fi
