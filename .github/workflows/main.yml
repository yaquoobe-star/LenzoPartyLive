name: Build Production Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Signed Production Release
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & Install SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a578e442d45c825e623e11401a5\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a578e442d45c825e623e11401a5\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/tools/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Decode & Validate Release Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One or more required GitHub signing secrets (KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD) are missing."
            exit 1
          fi
          KEYSTORE_FILE="${{ runner.temp }}/linzo-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "Release keystore decoded and alias verified."

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android SDK & Gradle for CI
        run: |
          rm -f android/local.properties android/app/release.keystore
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/variables.gradle || true
          chmod +x android/gradlew

      - name: Build Signed Production APK & AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:clean :app:assembleRelease :app:bundleRelease -x lint -x test --no-daemon --stacktrace

      - name: Stage Production Binaries
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/app-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist-android/app-release.aab
          ls -lh dist-android/app-release.apk dist-android/app-release.aab

      - name: Verify APK & AAB Signatures, Metadata, and Certificate Match
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          echo "=== 1. Verify APK Signature (apksigner) ==="
          "$APKSIGNER" verify --verbose --print-certs dist-android/app-release.apk > apk_verify.txt
          cat apk_verify.txt

          if grep -qi "CN=Android Debug" apk_verify.txt; then
            echo "::error::APK is signed with a debug certificate! Production release aborted."
            exit 1
          fi

          APK_SHA256=$(grep -i "Signer #1 certificate SHA-256 digest:" apk_verify.txt | awk '{print tolower($NF)}' | head -n 1)
          if [ -z "$APK_SHA256" ]; then
            echo "::error::Failed to extract APK SHA-256 signing certificate digest."
            exit 1
          fi
          echo "APK Signer SHA-256: $APK_SHA256"

          echo "=== 2. Check APK Package ID & Version ==="
          "$AAPT2" dump badging dist-android/app-release.apk > apk_badging.txt
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:" apk_badging.txt

          echo "=== 3. Verify AAB Signature (jarsigner) ==="
          jarsigner -verify -verbose -certs dist-android/app-release.aab > aab_verify.txt
          tail -n 15 aab_verify.txt

          keytool -printcert -jarfile dist-android/app-release.aab > aab_cert.txt
          AAB_SHA256=$(grep -m 1 "SHA256:" aab_cert.txt | sed 's/.*SHA256://g' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [ -z "$AAB_SHA256" ]; then
            echo "::error::Failed to extract AAB SHA-256 signing certificate digest."
            exit 1
          fi
          echo "AAB Signer SHA-256: $AAB_SHA256"

          if [ "$APK_SHA256" != "$AAB_SHA256" ]; then
            echo "::error::Certificate mismatch between app-release.apk ($APK_SHA256) and app-release.aab ($AAB_SHA256)!"
            exit 1
          fi
          echo "Confirmed: app-release.apk and app-release.aab share the exact same release certificate."

          echo "=== 4. Validate AAB via bundletool ==="
          curl -sSL -o "${{ runner.temp }}/bundletool.jar" "https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar"
          java -jar "${{ runner.temp }}/bundletool.jar" validate --bundle=dist-android/app-release.aab
          java -jar "${{ runner.temp }}/bundletool.jar" dump manifest --bundle=dist-android/app-release.aab > aab_manifest.txt
          grep -E "package=|versionCode=|versionName=" aab_manifest.txt

      - name: Clean Up Temporary Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/linzo-release.keystore" "${{ runner.temp }}/bundletool.jar" apk_verify.txt apk_badging.txt aab_verify.txt aab_cert.txt aab_manifest.txt

      - name: Upload Signed Production APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: dist-android/app-release.apk
          retention-days: 30

      - name: Upload Signed Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: dist-android/app-release.aab
          retention-days: 30

      - name: Upload Combined Production Package
        uses: actions/upload-artifact@v4
        with:
          name: LinzoPartyLive-Production-Release
          path: |
            dist-android/app-release.apk
            dist-android/app-release.aab
          retention-days: 30
